<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Watermill Cup 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="deck">
    <div id="slide-viewport">
      <!-- slides get injected here by app.js -->
    </div>

    <div id="hud">
      <div id="progress-track">
        <div id="progress-fill"></div>
      </div>
      <div id="hud-row">
        <button id="btn-prev" class="nav-btn" aria-label="Previous slide">&larr;</button>
        <div id="slide-counter">1 / 1</div>
        <button id="btn-next" class="nav-btn" aria-label="Next slide">&rarr;</button>
        <button id="btn-fullscreen" class="nav-btn" aria-label="Toggle fullscreen">&#x26F6;</button>
      </div>
    </div>

    <div id="click-zone-prev" aria-hidden="true"></div>
    <div id="click-zone-next" aria-hidden="true"></div>
  </div>

  <script src="slides.js"></script>
  <script src="app.js"></script>
</body>
</html>
